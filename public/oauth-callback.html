<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KEAOS | OAuth 2.0 Authorization Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background-color: #001E50;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #0B0F19;
      border: 1px solid #00338D;
      border-top: 4px solid #00A3A6;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 163, 166, 0.2);
      border-top-color: #00A3A6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.5;
      margin: 0;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-family: monospace;
      font-weight: bold;
      background: #00A3A6;
      color: #FFFFFF;
      padding: 2px 8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">KEAOS OAUTH 2.0 PROTOCOL</div>
    <h2>Authorizing Studio Integration...</h2>
    <div class="spinner" id="spinner"></div>
    <p id="status">Verifying secure OAuth credentials and returning to KEAOS Studio.</p>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      
      const code = urlParams.get('code') || hashParams.get('code') || hashParams.get('access_token');
      const state = urlParams.get('state') || hashParams.get('state');
      const error = urlParams.get('error') || hashParams.get('error');
      const errorDescription = urlParams.get('error_description') || hashParams.get('error_description');

      const payload = {
        type: 'KEAOS_OAUTH_RESPONSE',
        code: code,
        state: state,
        error: error,
        errorDescription: errorDescription,
        rawHash: window.location.hash
      };

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, window.location.origin);
        document.getElementById('status').innerText = 'Handshake received. Closing popup window...';
        setTimeout(function() {
          window.close();
        }, 600);
      } else {
        document.getElementById('status').innerText = 'Authorization code received. You can close this window.';
      }
    })();
  </script>
</body>
</html>
